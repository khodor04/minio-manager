<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MinIO Manager</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #21253a;
      --border: #2e3352;
      --accent: #4f8ef7;
      --accent-hover: #6ba3ff;
      --danger: #e05252;
      --danger-hover: #f06666;
      --success: #4caf7d;
      --text: #e2e6f3;
      --text-muted: #7a82a6;
      --folder: #f5c842;
      --radius: 6px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo { font-weight: 700; font-size: 16px; letter-spacing: .5px; color: var(--accent); white-space: nowrap; }
    .alias-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: var(--radius);
      font-size: 13px;
      min-width: 160px;
    }
    header .spacer { flex: 1; }
    .btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      transition: border-color .15s, background .15s;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); background: #272b42; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-sm { padding: 3px 8px; font-size: 12px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Error banner ── */
    .error-banner {
      background: #3a1a1a;
      border-bottom: 1px solid var(--danger);
      color: #ff9999;
      padding: 8px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .error-banner span { flex: 1; word-break: break-all; }

    /* ── Main layout ── */
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text-muted);
    }
    .bucket-list { flex: 1; overflow-y: auto; padding: 4px 0; }
    .bucket-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      cursor: pointer;
      border-radius: 0;
      transition: background .12s;
      user-select: none;
    }
    .bucket-item:hover { background: var(--surface2); }
    .bucket-item.active { background: #1f2d52; color: var(--accent); }
    .bucket-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .bucket-item .del-btn { opacity: 0; font-size: 16px; color: var(--text-muted); line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 3px; }
    .bucket-item:hover .del-btn { opacity: 1; }
    .bucket-item .del-btn:hover { color: var(--danger); background: rgba(224,82,82,.15); }

    /* ── Main content ── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    .toolbar {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      background: var(--surface);
      flex-wrap: wrap;
    }
    .breadcrumbs { display: flex; align-items: center; gap: 2px; flex: 1; flex-wrap: wrap; min-width: 0; }
    .breadcrumb-sep { color: var(--text-muted); margin: 0 2px; }
    .breadcrumb-link {
      color: var(--accent);
      cursor: pointer;
      border-radius: 3px;
      padding: 1px 4px;
      white-space: nowrap;
    }
    .breadcrumb-link:hover { background: var(--surface2); }
    .breadcrumb-current { color: var(--text); padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: var(--radius);
      font-size: 13px;
      width: 180px;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { outline: none; border-color: var(--accent); }

    /* ── Upload drop zone ── */
    .drop-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .drop-overlay {
      position: absolute; inset: 0;
      background: rgba(79,142,247,.12);
      border: 2px dashed var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--accent); font-weight: 600;
      z-index: 10; pointer-events: none;
      border-radius: 4px;
    }

    /* ── Object table ── */
    .object-table-wrap { flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      position: sticky; top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--text-muted);
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
    }
    th:hover { color: var(--text); }
    td { padding: 8px 14px; border-bottom: 1px solid #1e2235; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr { cursor: pointer; transition: background .1s; }
    tbody tr:hover { background: var(--surface2); }
    tbody tr.selected { background: #1f2d52; }
    tbody tr.checked { background: #18243d; }
    .cell-name { display: flex; align-items: center; gap: 8px; }
    .cell-name .icon { font-size: 16px; flex-shrink: 0; }
    .cell-name .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell-size, .cell-date { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
    .empty-state {
      padding: 60px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
    }
    .empty-state .sub { font-size: 13px; margin-top: 6px; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Detail panel ── */
    .detail-panel {
      width: 300px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
      padding: 16px;
      gap: 12px;
    }
    .detail-panel .dp-title { font-weight: 700; font-size: 14px; word-break: break-all; margin-bottom: 4px; }
    .detail-row { display: flex; flex-direction: column; gap: 2px; }
    .detail-row .label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: .7px; }
    .detail-row .value { font-size: 13px; word-break: break-all; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .dp-close { margin-left: auto; cursor: pointer; color: var(--text-muted); font-size: 18px; line-height: 1; }
    .dp-close:hover { color: var(--text); }

    /* ── Main area with optional detail panel ── */
    .content-area {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Modal overlay ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      width: 460px;
      max-width: 95vw;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal h2 { font-size: 16px; font-weight: 700; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; display: block; margin-bottom: 4px; }
    input[type=text], input[type=url], input[type=password], input[type=number], textarea, select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; font-family: 'Consolas', monospace; }
    .form-row { display: flex; flex-direction: column; gap: 4px; }

    /* ── Settings ── */
    .settings-section { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px; }
    .settings-section h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; }
    .alias-entry {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: var(--radius);
      margin-bottom: 6px;
      border: 1px solid var(--border);
    }
    .alias-entry .ae-name { font-weight: 600; font-size: 13px; }
    .alias-entry .ae-url { font-size: 12px; color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .tag-public { background: #1a3a1a; color: var(--success); border: 1px solid var(--success); }
    .tag-private { background: #2a2a1a; color: #c8a020; border: 1px solid #c8a020; }
    .tag-download { background: #1a2a3a; color: var(--accent); border: 1px solid var(--accent); }
    .tag-upload { background: #2a1a3a; color: #b07af0; border: 1px solid #b07af0; }
    .upload-progress { font-size: 12px; color: var(--text-muted); }
    .progress-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; }
    .progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width .2s; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333a5a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a5280; }

    /* ── Preview modal ── */
    .preview-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.88);
      display: flex; flex-direction: column;
      z-index: 200;
    }
    .preview-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }
    .preview-header .ph-name { font-weight: 600; font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-body {
      flex: 1; display: flex; align-items: center; justify-content: center;
      overflow: auto; padding: 16px; position: relative;
    }
    .preview-body img {
      max-width: 100%; max-height: 100%;
      object-fit: contain; border-radius: 4px;
      box-shadow: 0 4px 32px rgba(0,0,0,.6);
    }
    .preview-body video, .preview-body audio {
      max-width: 90%; max-height: 90%;
      border-radius: 4px;
    }
    .preview-body iframe {
      width: 100%; height: 100%; border: none; border-radius: 4px;
      background: #fff;
    }
    .preview-body pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow: auto;
      max-width: 900px;
      width: 100%;
      max-height: 100%;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .preview-loading { color: var(--text-muted); font-size: 15px; display: flex; align-items: center; gap: 10px; }
  </style>
</head>
<body x-data="app()" x-init="init()">

  <!-- Header -->
  <header>
    <span class="logo">⚡ MinIO Manager</span>
    <select class="alias-select" x-model="currentAlias" @change="onAliasChange()" :disabled="aliases.length === 0">
      <option value="">— select alias —</option>
      <template x-for="a in aliases" :key="a.alias">
        <option :value="a.alias" x-text="a.alias"></option>
      </template>
    </select>
    <span class="spacer"></span>
    <button class="btn btn-sm" @click="showSettings = true">⚙ Settings</button>
  </header>

  <!-- Error banner -->
  <div class="error-banner" x-show="error" x-transition>
    <span x-text="error"></span>
    <button class="btn btn-sm btn-danger" @click="error = null">✕</button>
  </div>

  <!-- Main layout -->
  <div class="layout">
    <!-- Sidebar: Buckets -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Buckets</span>
        <button class="btn btn-sm btn-primary" @click="showNewBucket = true" :disabled="!currentAlias" title="New bucket">+ New</button>
      </div>
      <div class="bucket-list">
        <template x-if="loadingBuckets">
          <div style="padding:16px; text-align:center;"><span class="spinner"></span></div>
        </template>
        <template x-if="!loadingBuckets && buckets.length === 0 && currentAlias">
          <div style="padding:16px; color:var(--text-muted); font-size:12px; text-align:center;">No buckets found</div>
        </template>
        <template x-for="b in buckets" :key="b.key">
          <div class="bucket-item" :class="{active: currentBucket === b.key}" @click="selectBucket(b.key)">
            <span>🪣</span>
            <span class="name" x-text="b.key.replace('/', '')"></span>
            <span
              @click.stop="quickTogglePolicy(b.key.replace('/', ''))"
              :title="(bucketPolicies[b.key.replace('/','')]||'none')==='none' ? 'Private — click to make public' : 'Public — click to make private'"
              style="font-size:15px; cursor:pointer; line-height:1; padding:2px 3px; border-radius:3px; transition:opacity .15s;"
              x-text="(bucketPolicies[b.key.replace('/','')]||'none')==='none' ? '🔒' : '🔓'"
              :style="togglingPolicy===b.key.replace('/','') ? 'opacity:.4;pointer-events:none;' : ''">
            </span>
            <span class="del-btn" @click.stop="deleteBucket(b.key.replace('/', ''))" title="Delete bucket">×</span>
          </div>
        </template>
      </div>
    </aside>

    <!-- Main: Object Browser -->
    <div class="main">
      <!-- Toolbar -->
      <div class="toolbar">
        <template x-if="currentBucket">
          <div class="breadcrumbs">
            <span class="breadcrumb-link" @click="browse('')" x-text="currentBucket.replace('/', '')"></span>
            <template x-for="(crumb, idx) in breadcrumbs" :key="crumb.prefix">
              <span class="breadcrumb-sep">/</span>
              <template x-if="idx < breadcrumbs.length - 1">
                <span class="breadcrumb-link" x-text="crumb.label" @click="browse(crumb.prefix)"></span>
              </template>
              <template x-if="idx === breadcrumbs.length - 1">
                <span class="breadcrumb-current" x-text="crumb.label"></span>
              </template>
            </template>
          </div>
        </template>
        <template x-if="!currentBucket">
          <div style="color:var(--text-muted); font-size:13px; flex:1;">Select a bucket to browse</div>
        </template>
        <template x-if="currentBucket">
          <input class="search-input" type="text" placeholder="🔍 Search (*.png, etc.)" x-model="searchPattern" @keyup.enter="doSearch()">
        </template>
        <template x-if="currentBucket">
          <label class="btn btn-primary btn-sm" style="cursor:pointer;" title="Upload files">
            ↑ Upload
            <input type="file" multiple style="display:none" @change="uploadFiles($event)">
          </label>
        </template>
        <template x-if="currentBucket">
          <button class="btn btn-sm" @click="createFolderModal = true" title="Create folder">+ Folder</button>
        </template>
      </div>

      <!-- Bulk action bar -->
      <div x-show="checkedKeys.size > 0" style="padding:7px 14px; background:#1f2d52; border-bottom:1px solid var(--accent); display:flex; align-items:center; gap:10px; flex-shrink:0;">
        <span style="font-size:13px; font-weight:600; color:var(--accent);" x-text="`${checkedKeys.size} selected`"></span>
        <span style="flex:1;"></span>
        <button class="btn btn-sm" @click="bulkDownload()">↓ Download all</button>
        <button class="btn btn-sm btn-danger" @click="bulkDelete()">🗑 Delete all</button>
        <button class="btn btn-sm" @click="checkedKeys = new Set()">✕ Clear</button>
      </div>

      <!-- Upload progress -->
      <div x-show="uploadTotal > 0" style="padding:6px 14px; background:var(--surface); border-bottom:1px solid var(--border);">
        <div class="upload-progress">Uploading <span x-text="uploadDone"></span> / <span x-text="uploadTotal"></span> files…</div>
        <div class="progress-bar-wrap"><div class="progress-bar" :style="`width:${uploadTotal ? (uploadDone/uploadTotal*100) : 0}%`"></div></div>
      </div>

      <!-- Content area (objects + detail panel) -->
      <div class="content-area">
        <!-- Drop zone + table -->
        <div class="drop-zone"
          @dragover.prevent="dragging = true"
          @dragleave.prevent="dragging = false"
          @drop.prevent="handleDrop($event)">

          <div class="drop-overlay" x-show="dragging">Drop files to upload</div>

          <div class="object-table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:36px; padding:8px 10px;" @click.stop>
                    <input type="checkbox" @change="toggleAll($event)" :checked="sortedObjects.length > 0 && checkedKeys.size === sortedObjects.length" :indeterminate.prop="checkedKeys.size > 0 && checkedKeys.size < sortedObjects.length" style="cursor:pointer; width:15px; height:15px;">
                  </th>
                  <th @click="sortBy('key')">Name <span x-text="sortField==='key' ? (sortAsc?'▲':'▼') : ''"></span></th>
                  <th style="width:15%;" @click="sortBy('size')">Size <span x-text="sortField==='size' ? (sortAsc?'▲':'▼') : ''"></span></th>
                  <th style="width:22%;" @click="sortBy('lastModified')">Modified <span x-text="sortField==='lastModified' ? (sortAsc?'▲':'▼') : ''"></span></th>
                  <th style="width:10%;"></th>
                </tr>
              </thead>
              <tbody>
                <template x-if="loadingObjects">
                  <tr><td colspan="5" style="text-align:center; padding:40px;"><span class="spinner"></span></td></tr>
                </template>
                <template x-if="!loadingObjects && sortedObjects.length === 0 && currentBucket">
                  <tr><td colspan="5">
                    <div class="empty-state">
                      📭 Empty
                      <div class="sub">Upload files or create a folder</div>
                    </div>
                  </td></tr>
                </template>
                <template x-for="obj in sortedObjects" :key="obj.key">
                  <tr :class="{selected: selectedObject && selectedObject.key === obj.key, checked: checkedKeys.has(obj.key)}"
                      @click="selectObject(obj)"
                      @dblclick="obj.type === 'folder' ? browse(obj.key) : openPreview(obj)">
                    <td style="padding:8px 10px;" @click.stop>
                      <input type="checkbox" :checked="checkedKeys.has(obj.key)" @change="toggleCheck(obj.key, $event)" style="cursor:pointer; width:15px; height:15px;">
                    </td>
                    <td>
                      <div class="cell-name">
                        <span class="icon" x-text="obj.type === 'folder' ? '📁' : fileIcon(obj.key)"></span>
                        <span class="fname" x-text="displayName(obj.key)"></span>
                      </div>
                    </td>
                    <td class="cell-size" x-text="obj.type === 'folder' ? '' : formatSize(obj.size)"></td>
                    <td class="cell-date" x-text="obj.type === 'folder' ? '' : formatDate(obj.lastModified)"></td>
                    <td style="text-align:right;">
                      <template x-if="obj.type !== 'folder'">
                        <button class="btn btn-sm" @click.stop="downloadFile(obj.key)" title="Download">↓</button>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Detail panel -->
        <div class="detail-panel" x-show="selectedObject" x-transition:enter="transition" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
          <template x-if="selectedObject">
            <div style="display:flex; flex-direction:column; gap:12px;">
              <div style="display:flex; align-items:flex-start; gap:6px;">
                <span style="font-size:28px;" x-text="selectedObject.type === 'folder' ? '📁' : fileIcon(selectedObject.key)"></span>
                <div style="flex:1; min-width:0;">
                  <div class="dp-title" x-text="displayName(selectedObject.key)"></div>
                </div>
                <span class="dp-close" @click="selectedObject = null">×</span>
              </div>

              <div class="detail-row">
                <span class="label">Full Path</span>
                <span class="value" x-text="currentAlias + '/' + currentBucket.replace('/','') + '/' + selectedObject.key"></span>
              </div>

              <template x-if="selectedObject.type !== 'folder'">
                <div class="detail-row">
                  <span class="label">Size</span>
                  <span class="value" x-text="formatSize(selectedObject.size)"></span>
                </div>
              </template>

              <template x-if="selectedObject.lastModified">
                <div class="detail-row">
                  <span class="label">Modified</span>
                  <span class="value" x-text="formatDate(selectedObject.lastModified)"></span>
                </div>
              </template>

              <template x-if="statInfo">
                <div class="detail-row">
                  <span class="label">Content Type</span>
                  <span class="value" x-text="statInfo.metadata && statInfo.metadata['Content-Type'] ? statInfo.metadata['Content-Type'] : statInfo.contentType || '—'"></span>
                </div>
              </template>

              <template x-if="statInfo && statInfo.etag">
                <div class="detail-row">
                  <span class="label">ETag</span>
                  <span class="value" style="font-family:monospace; font-size:12px;" x-text="statInfo.etag"></span>
                </div>
              </template>

              <div class="detail-actions">
                <template x-if="selectedObject.type !== 'folder'">
                  <button class="btn btn-sm btn-primary" @click="openPreview(selectedObject)">👁 Preview</button>
                </template>
                <template x-if="selectedObject.type !== 'folder'">
                  <button class="btn btn-sm" @click="downloadFile(selectedObject.key)">↓ Download</button>
                </template>
                <button class="btn btn-sm" @click="copyMoveModal = {mode:'copy', key: selectedObject.key}">Copy</button>
                <button class="btn btn-sm" @click="copyMoveModal = {mode:'move', key: selectedObject.key}">Move</button>
                <button class="btn btn-sm btn-danger" @click="deleteObject(selectedObject)">Delete</button>
              </div>

              <template x-if="currentBucket">
                <div style="border-top: 1px solid var(--border); padding-top: 12px;">
                  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                    <span class="label" style="margin:0;" x-text="selectedObject.type === 'folder' ? 'Folder Policy' : 'Bucket Policy'"></span>
                    <button class="btn btn-sm" @click="loadPolicy(selectedObject)">Manage</button>
                  </div>
                  <template x-if="policyInfo !== null">
                    <span class="tag" :class="policyTagClass(policyInfo)" x-text="policyInfo || 'none'"></span>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Modals ── -->

  <!-- New Bucket Modal -->
  <div class="modal-backdrop" x-show="showNewBucket" @click.self="showNewBucket = false">
    <div class="modal" @keyup.escape.window="showNewBucket = false">
      <h2>New Bucket</h2>
      <div class="form-row">
        <label>Bucket Name</label>
        <input type="text" x-model="newBucketName" @keyup.enter="createBucket()" placeholder="my-bucket" autofocus>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="showNewBucket = false">Cancel</button>
        <button class="btn btn-primary" @click="createBucket()" :disabled="!newBucketName.trim()">Create</button>
      </div>
    </div>
  </div>

  <!-- New Folder Modal -->
  <div class="modal-backdrop" x-show="createFolderModal" @click.self="createFolderModal = false">
    <div class="modal" @keyup.escape.window="createFolderModal = false">
      <h2>Create Folder</h2>
      <div class="form-row">
        <label>Folder Name</label>
        <input type="text" x-model="newFolderName" @keyup.enter="createFolder()" placeholder="my-folder">
      </div>
      <div class="modal-footer">
        <button class="btn" @click="createFolderModal = false">Cancel</button>
        <button class="btn btn-primary" @click="createFolder()" :disabled="!newFolderName.trim()">Create</button>
      </div>
    </div>
  </div>

  <!-- Copy / Move Modal -->
  <div class="modal-backdrop" x-show="copyMoveModal" @click.self="copyMoveModal = null">
    <div class="modal" x-if="copyMoveModal" @keyup.escape.window="copyMoveModal = null">
      <h2 x-text="copyMoveModal && copyMoveModal.mode === 'copy' ? 'Copy Object' : 'Move Object'"></h2>
      <div class="form-row">
        <label>Source</label>
        <input type="text" :value="copyMoveModal ? buildFullPath(copyMoveModal.key) : ''" readonly style="opacity:.7;">
      </div>
      <div class="form-row">
        <label>Destination (full mc path, e.g. alias/bucket/path)</label>
        <input type="text" x-model="copyMoveDest" placeholder="alias/bucket/new-path/file.txt">
      </div>
      <div class="modal-footer">
        <button class="btn" @click="copyMoveModal = null">Cancel</button>
        <button class="btn btn-primary" @click="doCopyMove()" :disabled="!copyMoveDest.trim()" x-text="copyMoveModal && copyMoveModal.mode === 'copy' ? 'Copy' : 'Move'"></button>
      </div>
    </div>
  </div>

  <!-- Policy Modal -->
  <div class="modal-backdrop" x-show="showPolicyModal" @click.self="showPolicyModal = false">
    <div class="modal" @keyup.escape.window="showPolicyModal = false">
      <h2 x-text="policyTarget && policyTarget.isFolder ? 'Folder Policy' : 'Bucket Policy'"></h2>
      <div style="font-size:12px; color:var(--text-muted); margin-top:-8px;" x-text="policyTarget ? policyTarget.path : ''"></div>
      <template x-if="policyTarget && !policyTarget.isFolder">
        <div class="form-row">
          <label>Preset</label>
          <select x-model="policyPreset" @change="applyPolicyPreset()">
            <option value="simple">Simple level (public / private)</option>
            <option value="hotlink">Hotlink protection (domain-only access)</option>
            <option value="custom">Custom JSON</option>
          </select>
        </div>
      </template>

      <!-- Simple level selector -->
      <template x-if="policyTarget && !policyTarget.isFolder && policyPreset === 'simple'">
        <div class="form-row">
          <label>Access Level</label>
          <select x-model="policyLevel">
            <option value="none">none (private)</option>
            <option value="download">download (public read)</option>
            <option value="upload">upload (anonymous write)</option>
            <option value="public">public (full access)</option>
          </select>
        </div>
      </template>

      <!-- Hotlink protection -->
      <template x-if="policyTarget && !policyTarget.isFolder && policyPreset === 'hotlink'">
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div style="font-size:12px; color:#f5c842; background:#2a2510; padding:8px 10px; border-radius:var(--radius); border:1px solid #5a4a10;">
            ⚠ The <code>Referer</code> header can be spoofed or stripped — this prevents casual direct access and hotlinking, not determined attackers.
          </div>
          <div class="form-row">
            <label>Allowed domains (one per line, wildcards ok)</label>
            <textarea x-model="hotlinkDomains" @input="buildHotlinkPolicy()" placeholder="https://decisionstory.net/*&#10;https://www.decisionstory.net/*" style="min-height:80px; font-family:monospace;"></textarea>
          </div>
        </div>
      </template>

      <!-- Folder note -->
      <template x-if="policyTarget && policyTarget.isFolder">
        <div style="font-size:12px; color:var(--text-muted); background:var(--surface2); padding:8px 10px; border-radius:var(--radius); border:1px solid var(--border);">
          Folder-level policies require custom JSON. A template is pre-filled below — edit the <code style="color:var(--accent);">Action</code> list as needed.
        </div>
      </template>

      <div class="form-row">
        <label x-text="policyPreset === 'simple' && !policyTarget.isFolder ? 'Custom JSON (optional override)' : 'JSON Policy'"></label>
        <textarea x-model="policyCustomJson" :placeholder="policyTarget && policyTarget.isFolder ? '' : '{&quot;Version&quot;:&quot;2012-10-17&quot;,&quot;Statement&quot;:[...]}'" style="min-height:120px;" :readonly="policyPreset === 'hotlink'"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" @click="showPolicyModal = false">Cancel</button>
        <button class="btn btn-primary" @click="savePolicy()">Save Policy</button>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="preview-backdrop" x-show="previewModal" @keyup.escape.window="closePreview()">
    <div class="preview-header">
      <span x-text="previewModal ? fileIcon(previewModal.key) : ''"></span>
      <span class="ph-name" x-text="previewModal ? previewModal.key.split('/').pop() : ''"></span>
      <button class="btn btn-sm" @click="downloadFile(previewModal.key)">↓ Download</button>
      <button class="btn btn-sm btn-danger" @click="closePreview()">✕ Close</button>
    </div>
    <div class="preview-body">
      <!-- Spinner overlay — shown while loading, hidden once media fires load/error -->
      <template x-if="previewLoading">
        <div class="preview-loading" style="position:absolute;"><span class="spinner"></span> Loading preview…</div>
      </template>
      <!-- Image -->
      <template x-if="previewType === 'image'">
        <img :src="previewUrl"
             :alt="previewModal ? previewModal.key : ''"
             :style="previewLoading ? 'opacity:0;position:absolute;pointer-events:none;' : ''"
             @load="previewLoading = false"
             @error="previewLoading = false; previewType = 'unsupported'">
      </template>
      <!-- Video -->
      <template x-if="previewType === 'video'">
        <video controls autoplay :src="previewUrl"
               :style="previewLoading ? 'opacity:0;position:absolute;pointer-events:none;' : ''"
               @loadeddata="previewLoading = false"
               @canplay="previewLoading = false"
               @error="previewLoading = false; previewType = 'unsupported'"></video>
      </template>
      <!-- Audio -->
      <template x-if="previewType === 'audio'">
        <audio controls autoplay :src="previewUrl" style="width:400px;"
               :style="previewLoading ? 'opacity:0;position:absolute;pointer-events:none;' : ''"
               @canplay="previewLoading = false"
               @error="previewLoading = false; previewType = 'unsupported'"></audio>
      </template>
      <!-- PDF -->
      <template x-if="previewType === 'pdf'">
        <iframe :src="previewUrl" style="width:100%;height:100%;"
                @load="previewLoading = false"
                @error="previewLoading = false; previewType = 'unsupported'"></iframe>
      </template>
      <!-- Text -->
      <template x-if="previewType === 'text'">
        <pre x-text="previewText"></pre>
      </template>
      <!-- Unsupported -->
      <template x-if="previewType === 'unsupported'">
        <div style="text-align:center; color:var(--text-muted);">
          <div style="font-size:48px; margin-bottom:12px;">🚫</div>
          <div>Preview not available for this file type.</div>
          <div style="margin-top:12px;"><button class="btn btn-primary" @click="downloadFile(previewModal.key)">↓ Download instead</button></div>
        </div>
      </template>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" x-show="showSettings" @click.self="showSettings = false">
    <div class="modal" style="width:520px; max-height:85vh; overflow-y:auto;" @keyup.escape.window="showSettings = false">
      <h2>⚙ Settings</h2>

      <div class="form-row">
        <label>mc Path</label>
        <input type="text" x-model="settingsMcPath" placeholder="mc (or full path to mc.exe)">
      </div>

      <div class="settings-section">
        <h3>Aliases (MinIO Connections)</h3>
        <template x-for="a in aliases" :key="a.alias">
          <div class="alias-entry">
            <span class="ae-name" x-text="a.alias"></span>
            <span class="ae-url" x-text="a.URL || a.url || ''"></span>
            <button class="btn btn-sm btn-danger" @click="deleteAlias(a.alias)">Remove</button>
          </div>
        </template>
        <template x-if="aliases.length === 0">
          <div style="color:var(--text-muted); font-size:12px; margin-bottom:8px;">No aliases configured yet.</div>
        </template>

        <div style="border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-top:10px; background:var(--surface2);">
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:10px;">Add New Alias</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <div class="form-row">
              <label>Alias Name</label>
              <input type="text" x-model="newAlias.name" placeholder="myminio">
            </div>
            <div class="form-row">
              <label>URL</label>
              <input type="url" x-model="newAlias.url" placeholder="http://localhost:9000">
            </div>
            <div class="form-row">
              <label>Access Key</label>
              <input type="text" x-model="newAlias.accessKey" placeholder="minioadmin">
            </div>
            <div class="form-row">
              <label>Secret Key</label>
              <input type="password" x-model="newAlias.secretKey" placeholder="••••••••">
            </div>
          </div>
          <div style="margin-top:10px;">
            <button class="btn btn-primary btn-sm" @click="addAlias()" :disabled="!newAlias.name || !newAlias.url || !newAlias.accessKey || !newAlias.secretKey">Add Alias</button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn" @click="showSettings = false">Close</button>
        <button class="btn btn-primary" @click="saveSettings()">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
  function app() {
    return {
      // --- State ---
      aliases: [],
      currentAlias: '',
      buckets: [],
      currentBucket: '',
      currentPrefix: '',
      objects: [],
      sortField: 'key',
      sortAsc: true,
      selectedObject: null,
      statInfo: null,
      policyInfo: null,
      error: null,
      loadingBuckets: false,
      loadingObjects: false,
      dragging: false,
      searchPattern: '',

      // Upload
      uploadTotal: 0,
      uploadDone: 0,

      // Bulk selection
      checkedKeys: new Set(),

      // Preview
      previewModal: null,
      previewType: null,
      previewUrl: null,
      previewText: null,
      previewLoading: false,

      // Modals
      showNewBucket: false,
      newBucketName: '',
      createFolderModal: false,
      newFolderName: '',
      copyMoveModal: null,
      copyMoveDest: '',
      showPolicyModal: false,
      policyLevel: 'none',
      policyCustomJson: '',
      policyTarget: null,
      policyPreset: 'simple',
      hotlinkDomains: '',
      bucketPolicies: {},
      togglingPolicy: null,
      showSettings: false,
      settingsMcPath: 'mc',
      newAlias: { name: '', url: '', accessKey: '', secretKey: '' },

      // --- Init ---
      async init() {
        await this.loadConfig();
        await this.loadAliases();
      },

      async loadConfig() {
        try {
          const r = await fetch('/api/config');
          if (r.ok) {
            const cfg = await r.json();
            this.settingsMcPath = cfg.mc_path || 'mc';
            if (cfg.default_alias) this.currentAlias = cfg.default_alias;
          }
        } catch {}
      },

      async saveSettings() {
        await this.apiPost('/api/config', { mc_path: this.settingsMcPath, default_alias: this.currentAlias });
        this.showSettings = false;
      },

      // --- Aliases ---
      async loadAliases() {
        try {
          const data = await this.apiGet('/api/aliases');
          this.aliases = Array.isArray(data) ? data.filter(a => a.alias) : [];
          if (!this.currentAlias && this.aliases.length) {
            this.currentAlias = this.aliases[0].alias;
            await this.loadBuckets();
          } else if (this.currentAlias) {
            await this.loadBuckets();
          }
        } catch (e) { this.error = e.message; }
      },

      async addAlias() {
        try {
          await this.apiPost('/api/aliases', this.newAlias);
          this.newAlias = { name: '', url: '', accessKey: '', secretKey: '' };
          await this.loadAliases();
        } catch (e) { this.error = e.message; }
      },

      async deleteAlias(name) {
        if (!confirm(`Remove alias "${name}"?`)) return;
        try {
          await this.apiDelete(`/api/aliases/${encodeURIComponent(name)}`);
          if (this.currentAlias === name) { this.currentAlias = ''; this.buckets = []; }
          await this.loadAliases();
        } catch (e) { this.error = e.message; }
      },

      async onAliasChange() {
        this.currentBucket = '';
        this.objects = [];
        this.selectedObject = null;
        await this.loadBuckets();
      },

      // --- Buckets ---
      async loadBuckets() {
        if (!this.currentAlias) return;
        this.loadingBuckets = true;
        try {
          this.buckets = await this.apiGet(`/api/buckets?alias=${encodeURIComponent(this.currentAlias)}`);
          // Fetch policy for each bucket in background
          this.bucketPolicies = {};
          for (const b of this.buckets) {
            const bucket = (b.key || '').replace(/\/$/, '');
            if (!bucket) continue;
            try {
              const p = new URLSearchParams({ alias: this.currentAlias, bucket });
              const data = await this.apiGet(`/api/policy?${p}`);
              this.bucketPolicies[bucket] = data.anonymousPermission || data.permission || 'none';
            } catch { this.bucketPolicies[bucket] = '?'; }
          }
        } catch (e) { this.error = e.message; }
        this.loadingBuckets = false;
      },

      async selectBucket(key) {
        this.currentBucket = key;
        this.currentPrefix = '';
        this.selectedObject = null;
        this.checkedKeys = new Set();
        await this.loadObjects();
      },

      async createBucket() {
        if (!this.newBucketName.trim()) return;
        try {
          await this.apiPost('/api/buckets', { alias: this.currentAlias, name: this.newBucketName.trim() });
          this.newBucketName = '';
          this.showNewBucket = false;
          await this.loadBuckets();
        } catch (e) { this.error = e.message; }
      },

      async deleteBucket(name) {
        if (!confirm(`Delete bucket "${name}"? This cannot be undone.`)) return;
        try {
          await this.apiDelete(`/api/buckets/${encodeURIComponent(name)}?alias=${encodeURIComponent(this.currentAlias)}`);
          if (this.currentBucket === name + '/') { this.currentBucket = ''; this.objects = []; }
          await this.loadBuckets();
        } catch (e) { this.error = e.message; }
      },

      // --- Objects ---
      async loadObjects() {
        if (!this.currentAlias || !this.currentBucket) return;
        this.loadingObjects = true;
        this.objects = [];
        try {
          const bucket = this.currentBucket.replace(/\/$/, '');
          const params = new URLSearchParams({
            alias: this.currentAlias,
            bucket,
            prefix: this.currentPrefix,
          });
          const raw = await this.apiGet(`/api/objects?${params}`);
          // mc ls returns keys relative to the prefix — prepend prefix for full path
          const prefix = this.currentPrefix;
          this.objects = raw.map(o => ({ ...o, key: prefix + o.key }));
        } catch (e) { this.error = e.message; }
        this.loadingObjects = false;
      },

      async browse(prefix) {
        this.currentPrefix = prefix;
        this.selectedObject = null;
        this.statInfo = null;
        this.checkedKeys = new Set();
        await this.loadObjects();
      },

      get breadcrumbs() {
        if (!this.currentPrefix) return [];
        const parts = this.currentPrefix.split('/').filter(Boolean);
        return parts.map((p, i) => ({
          label: p,
          prefix: parts.slice(0, i + 1).join('/') + '/',
        }));
      },

      get sortedObjects() {
        const arr = [...this.objects];
        arr.sort((a, b) => {
          // folders first
          if (a.type === 'folder' && b.type !== 'folder') return -1;
          if (a.type !== 'folder' && b.type === 'folder') return 1;
          let va = a[this.sortField] || '';
          let vb = b[this.sortField] || '';
          if (this.sortField === 'size') { va = Number(va); vb = Number(vb); }
          if (va < vb) return this.sortAsc ? -1 : 1;
          if (va > vb) return this.sortAsc ? 1 : -1;
          return 0;
        });
        return arr;
      },

      sortBy(field) {
        if (this.sortField === field) this.sortAsc = !this.sortAsc;
        else { this.sortField = field; this.sortAsc = true; }
      },

      async selectObject(obj) {
        this.selectedObject = obj;
        this.statInfo = null;
        this.policyInfo = null;
        if (obj.type !== 'folder') {
          try {
            const bucket = this.currentBucket.replace(/\/$/, '');
            const params = new URLSearchParams({ alias: this.currentAlias, bucket, key: obj.key });
            this.statInfo = await this.apiGet(`/api/stat?${params}`);
          } catch {}
        }
      },

      // --- Upload ---
      async uploadFiles(event) {
        const files = Array.from(event.target.files || []);
        event.target.value = '';
        await this.doUpload(files);
      },

      async handleDrop(event) {
        this.dragging = false;
        const files = Array.from(event.dataTransfer.files || []);
        await this.doUpload(files);
      },

      async doUpload(files) {
        if (!files.length || !this.currentBucket) return;
        this.uploadTotal = files.length;
        this.uploadDone = 0;
        for (const file of files) {
          const fd = new FormData();
          fd.append('alias', this.currentAlias);
          fd.append('bucket', this.currentBucket.replace(/\/$/, ''));
          fd.append('prefix', this.currentPrefix);
          fd.append('file', file);
          try {
            const r = await fetch('/api/upload', { method: 'POST', body: fd });
            if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'Upload failed'); }
          } catch (e) { this.error = e.message; }
          this.uploadDone++;
        }
        this.uploadTotal = 0;
        this.uploadDone = 0;
        await this.loadObjects();
      },

      // --- Download ---
      downloadFile(key) {
        const bucket = this.currentBucket.replace(/\/$/, '');
        const params = new URLSearchParams({ alias: this.currentAlias, bucket, key });
        const a = document.createElement('a');
        a.href = `/api/download?${params}`;
        a.download = key.split('/').pop();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      },

      // --- Delete ---
      async deleteObject(obj) {
        const name = this.displayName(obj.key);
        const isFolder = obj.type === 'folder';
        const msg = isFolder
          ? `Delete folder "${name}" and ALL its contents?`
          : `Delete "${name}"?`;
        if (!confirm(msg)) return;
        const bucket = this.currentBucket.replace(/\/$/, '');
        try {
          await this.apiDeleteBody('/api/objects', {
            alias: this.currentAlias, bucket,
            key: obj.key,
            recursive: isFolder,
          });
          this.selectedObject = null;
          await this.loadObjects();
        } catch (e) { this.error = e.message; }
      },

      // --- Create folder (empty placeholder) ---
      async createFolder() {
        const name = this.newFolderName.trim();
        if (!name) return;
        const bucket = this.currentBucket.replace(/\/$/, '');
        // Upload a zero-byte .keep file to create the virtual folder
        const blob = new Blob([], { type: 'application/octet-stream' });
        const file = new File([blob], '.keep');
        const fd = new FormData();
        fd.append('alias', this.currentAlias);
        fd.append('bucket', bucket);
        fd.append('prefix', this.currentPrefix + name + '/');
        fd.append('file', file);
        try {
          const r = await fetch('/api/upload', { method: 'POST', body: fd });
          if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'Failed'); }
          this.newFolderName = '';
          this.createFolderModal = false;
          await this.loadObjects();
        } catch (e) { this.error = e.message; }
      },

      // --- Copy / Move ---
      buildFullPath(key) {
        const bucket = this.currentBucket.replace(/\/$/, '');
        return `${this.currentAlias}/${bucket}/${key}`;
      },

      async doCopyMove() {
        if (!this.copyMoveDest.trim() || !this.copyMoveModal) return;
        const src = this.buildFullPath(this.copyMoveModal.key);
        const endpoint = this.copyMoveModal.mode === 'copy' ? '/api/copy' : '/api/move';
        try {
          await this.apiPost(endpoint, { src, dst: this.copyMoveDest.trim() });
          this.copyMoveModal = null;
          this.copyMoveDest = '';
          await this.loadObjects();
        } catch (e) { this.error = e.message; }
      },

      // --- Policy ---
      async loadPolicy(obj) {
        const bucket = this.currentBucket.replace(/\/$/, '');
        const isFolder = obj && obj.type === 'folder';
        const folderPrefix = isFolder ? obj.key : '';
        this.policyTarget = {
          isFolder,
          path: isFolder ? `${this.currentAlias}/${bucket}/${folderPrefix}` : `${this.currentAlias}/${bucket}`,
          folderPrefix,
        };
        try {
          if (isFolder) {
            const resource = `arn:aws:s3:::${bucket}/${folderPrefix}*`;
            this.policyCustomJson = JSON.stringify({
              Version: '2012-10-17',
              Statement: [{
                Effect: 'Allow',
                Principal: { AWS: ['*'] },
                Action: ['s3:GetObject'],
                Resource: [resource],
              }],
            }, null, 2);
            this.policyLevel = 'none';
            this.policyInfo = null;
          } else {
            const params = new URLSearchParams({ alias: this.currentAlias, bucket });
            const data = await this.apiGet(`/api/policy?${params}`);
            // mc anonymous get returns {"status":"success","anonymousPermission":"download"} or similar
            this.policyLevel = data.anonymousPermission || data.permission || 'none';
            this.policyInfo = this.policyLevel;
            this.policyCustomJson = '';
            this.policyPreset = 'simple';
            this.hotlinkDomains = '';
          }
          this.showPolicyModal = true;
        } catch (e) { this.error = e.message; }
      },

      async quickTogglePolicy(bucket) {
        const current = this.bucketPolicies[bucket] || 'none';
        const next = current === 'none' ? 'download' : 'none';
        this.togglingPolicy = bucket;
        try {
          await this.apiPost('/api/policy', { alias: this.currentAlias, bucket, level: next, customJson: '' });
          this.bucketPolicies = { ...this.bucketPolicies, [bucket]: next };
        } catch (e) { this.error = e.message; }
        this.togglingPolicy = null;
      },

      applyPolicyPreset() {
        if (this.policyPreset === 'simple') {
          this.policyCustomJson = '';
          this.hotlinkDomains = '';
        } else if (this.policyPreset === 'hotlink') {
          this.buildHotlinkPolicy();
        } else {
          // custom — leave textarea as-is
        }
      },

      buildHotlinkPolicy() {
        const bucket = this.currentBucket.replace(/\/$/, '');
        const domains = this.hotlinkDomains
          .split('\n')
          .map(d => d.trim())
          .filter(Boolean);
        if (!domains.length) { this.policyCustomJson = ''; return; }
        this.policyCustomJson = JSON.stringify({
          Version: '2012-10-17',
          Statement: [{
            Effect: 'Allow',
            Principal: { AWS: ['*'] },
            Action: ['s3:GetObject'],
            Resource: [`arn:aws:s3:::${bucket}/*`],
            Condition: {
              StringLike: {
                'aws:Referer': domains,
              },
            },
          }],
        }, null, 2);
      },

      async savePolicy() {
        const bucket = this.currentBucket.replace(/\/$/, '');
        try {
          await this.apiPost('/api/policy', {
            alias: this.currentAlias,
            bucket,
            level: this.policyLevel,
            customJson: this.policyCustomJson,
          });
          this.policyInfo = this.policyCustomJson ? 'custom' : this.policyLevel;
          this.showPolicyModal = false;
          // Refresh sidebar badge
          if (!this.policyTarget || !this.policyTarget.isFolder) {
            try {
              const p = new URLSearchParams({ alias: this.currentAlias, bucket });
              const data = await this.apiGet(`/api/policy?${p}`);
              this.bucketPolicies[bucket] = data.anonymousPermission || data.permission || 'none';
            } catch {}
          }
        } catch (e) { this.error = e.message; }
      },

      policyTagClass(level) {
        return {
          'tag-public': level === 'public',
          'tag-private': level === 'none' || !level,
          'tag-download': level === 'download',
          'tag-upload': level === 'upload',
        };
      },

      // --- Search ---
      async doSearch() {
        if (!this.searchPattern.trim() || !this.currentBucket) return;
        const bucket = this.currentBucket.replace(/\/$/, '');
        try {
          const params = new URLSearchParams({
            alias: this.currentAlias,
            bucket,
            prefix: this.currentPrefix,
            pattern: this.searchPattern.trim(),
          });
          const results = await this.apiGet(`/api/search?${params}`);
          // mc find returns objects with "key" field
          this.objects = results.filter(r => r.key).map(r => ({
            ...r,
            type: r.key.endsWith('/') ? 'folder' : 'file',
          }));
        } catch (e) { this.error = e.message; }
      },

      // --- Bulk selection ---
      toggleCheck(key, event) {
        const s = new Set(this.checkedKeys);
        if (event.target.checked) s.add(key);
        else s.delete(key);
        this.checkedKeys = s;
      },

      toggleAll(event) {
        if (event.target.checked) {
          this.checkedKeys = new Set(this.sortedObjects.map(o => o.key));
        } else {
          this.checkedKeys = new Set();
        }
      },

      async bulkDelete() {
        const keys = [...this.checkedKeys];
        if (!keys.length) return;
        if (!confirm(`Delete ${keys.length} item(s)? This cannot be undone.`)) return;
        const bucket = this.currentBucket.replace(/\/$/, '');
        let failed = 0;
        for (const key of keys) {
          const isFolder = key.endsWith('/');
          try {
            await this.apiDeleteBody('/api/objects', {
              alias: this.currentAlias, bucket, key, recursive: isFolder,
            });
          } catch { failed++; }
        }
        if (failed) this.error = `${failed} item(s) could not be deleted.`;
        this.checkedKeys = new Set();
        if (this.selectedObject && keys.includes(this.selectedObject.key)) this.selectedObject = null;
        await this.loadObjects();
      },

      bulkDownload() {
        const keys = [...this.checkedKeys].filter(k => !k.endsWith('/'));
        for (const key of keys) this.downloadFile(key);
      },

      // --- Preview ---
      async openPreview(obj) {
        const ext = obj.key.split('.').pop().toLowerCase();
        const IMAGE_EXTS = ['png','jpg','jpeg','gif','webp','svg','bmp','ico','avif'];
        const VIDEO_EXTS = ['mp4','webm','mov','avi','mkv','ogv'];
        const AUDIO_EXTS = ['mp3','wav','flac','ogg','aac','m4a'];
        const TEXT_EXTS  = ['txt','md','log','csv','json','yaml','yml','toml','xml',
                            'html','htm','js','ts','py','go','rs','sh','bat','css',
                            'ini','cfg','env','sql'];

        this.previewModal = obj;
        this.previewLoading = true;
        this.previewText = null;
        this.previewUrl = null;

        const bucket = this.currentBucket.replace(/\/$/, '');
        const params = new URLSearchParams({ alias: this.currentAlias, bucket, key: obj.key });
        const url = `/api/preview?${params}`;

        if (IMAGE_EXTS.includes(ext)) {
          this.previewType = 'image';
          this.previewUrl = url;
          // loading flag cleared by img @load
        } else if (VIDEO_EXTS.includes(ext)) {
          this.previewType = 'video';
          this.previewUrl = url;
        } else if (AUDIO_EXTS.includes(ext)) {
          this.previewType = 'audio';
          this.previewUrl = url;
        } else if (ext === 'pdf') {
          this.previewType = 'pdf';
          this.previewUrl = url;
        } else if (TEXT_EXTS.includes(ext)) {
          this.previewType = 'text';
          try {
            const r = await fetch(url);
            if (!r.ok) throw new Error('Failed to load');
            this.previewText = await r.text();
          } catch (e) { this.previewText = 'Could not load file: ' + e.message; }
          this.previewLoading = false;
        } else {
          this.previewType = 'unsupported';
          this.previewLoading = false;
        }
      },

      closePreview() {
        this.previewModal = null;
        this.previewUrl = null;
        this.previewText = null;
        this.previewType = null;
      },

      // --- Utilities ---
      displayName(key) {
        const parts = key.split('/').filter(Boolean);
        return parts[parts.length - 1] || key;
      },

      formatSize(bytes) {
        if (!bytes && bytes !== 0) return '—';
        const b = Number(bytes);
        if (b < 1024) return b + ' B';
        if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
        if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB';
        return (b / 1024 / 1024 / 1024).toFixed(2) + ' GB';
      },

      formatDate(dt) {
        if (!dt) return '—';
        try { return new Date(dt).toLocaleString(); } catch { return dt; }
      },

      fileIcon(key) {
        if (!key) return '📄';
        const ext = key.split('.').pop().toLowerCase();
        const icons = {
          png: '🖼', jpg: '🖼', jpeg: '🖼', gif: '🖼', webp: '🖼', svg: '🖼', ico: '🖼', bmp: '🖼',
          mp4: '🎬', mov: '🎬', avi: '🎬', mkv: '🎬', webm: '🎬',
          mp3: '🎵', wav: '🎵', flac: '🎵', ogg: '🎵',
          pdf: '📕',
          zip: '🗜', tar: '🗜', gz: '🗜', rar: '🗜', '7z': '🗜',
          json: '📋', yaml: '📋', yml: '📋', toml: '📋', xml: '📋',
          js: '📜', ts: '📜', py: '📜', go: '📜', rs: '📜', sh: '📜',
          txt: '📝', md: '📝', log: '📝', csv: '📝',
          html: '🌐', htm: '🌐',
          sql: '🗄', db: '🗄', sqlite: '🗄',
          exe: '⚙', msi: '⚙', dll: '⚙',
        };
        return icons[ext] || '📄';
      },

      // --- HTTP helpers ---
      async apiGet(url) {
        const r = await fetch(url);
        if (!r.ok) {
          const e = await r.json().catch(() => ({ detail: r.statusText }));
          throw new Error(e.detail || `HTTP ${r.status}`);
        }
        return r.json();
      },

      async apiPost(url, body) {
        const r = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({ detail: r.statusText }));
          throw new Error(e.detail || `HTTP ${r.status}`);
        }
        return r.json();
      },

      async apiDelete(url) {
        const r = await fetch(url, { method: 'DELETE' });
        if (!r.ok) {
          const e = await r.json().catch(() => ({ detail: r.statusText }));
          throw new Error(e.detail || `HTTP ${r.status}`);
        }
        return r.json();
      },

      async apiDeleteBody(url, body) {
        const r = await fetch(url, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({ detail: r.statusText }));
          throw new Error(e.detail || `HTTP ${r.status}`);
        }
        return r.json();
      },
    };
  }
  </script>
</body>
